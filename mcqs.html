<head>

  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --indigo: #4f46e5;
      --indigo-dark: #4338ca;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --green-bg: #dcfce7;
      --green-border: #22c55e;
      --green-text: #15803d;
      --red-bg: #fee2e2;
      --red-border: #ef4444;
      --red-text: #b91c1c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-back {
      text-decoration: none;
      background: #f1f5f9;
      color: var(--text);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border);
    }

    .btn-back:hover { background: #e2e8f0; }

    .brand {
      font-size: 19px;
      font-weight: 700;
      color: var(--indigo);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 14px;
      color: var(--muted);
    }

    .controls input {
      width: 60px;
      padding: 5px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
      color: var(--text);
      background: #fff;
      outline: none;
    }

    .controls input:focus {
      border-color: var(--indigo);
    }

    .btn-load {
      background: var(--indigo);
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-load:hover { background: var(--indigo-dark); }

    .score-badge {
      background: var(--indigo);
      color: #fff;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .container {
      max-width: 780px;
      margin: 24px auto 60px;
      padding: 0 16px;
    }

    .q-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
    }

    .q-title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 16px;
      color: var(--text);
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: #f8fafc;
      font-size: 14.5px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .option-label:hover:not(.locked) {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .option-label.locked {
      cursor: default;
    }

    .option-label input[type="radio"] {
      accent-color: #2563eb;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .option-label.correct {
      background: var(--green-bg);
      border-color: var(--green-border);
      color: var(--green-text);
      font-weight: 700;
    }

    .option-label.incorrect {
      background: var(--red-bg);
      border-color: var(--red-border);
      color: var(--red-text);
      font-weight: 500;
    }

    .feedback {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 700;
      display: none;
      align-items: center;
      gap: 6px;
    }

    .feedback.show { display: flex; }
    .feedback.correct-msg { color: var(--green-text); }
    .feedback.incorrect-msg { color: var(--red-text); }

    @media (max-width: 720px) {
      header {
        justify-content: center;
      }
    }
  </style>

</head>

    const letters = ["a", "b", "c", "d"];
    const quizContainer = document.getElementById("quiz-container");
    const scoreBadge = document.getElementById("score-badge");
    const rangeStartInput = document.getElementById("range-start");
    const rangeEndInput = document.getElementById("range-end");
    const btnLoad = document.getElementById("btn-load");

    let currentScore = 0;
    let totalLoaded = 0;

    function updateScore() {
      scoreBadge.textContent = `Score: ${currentScore} / ${totalLoaded}`;
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function loadQuiz() {
      let start = parseInt(rangeStartInput.value, 10) || 1;
      let end = parseInt(rangeEndInput.value, 10) || allQuestions.length;

      start = Math.max(1, Math.min(allQuestions.length, start));
      end = Math.max(1, Math.min(allQuestions.length, end));
      if (start > end) [start, end] = [end, start];

      rangeStartInput.value = start;
      rangeEndInput.value = end;

      const selected = allQuestions.slice(start - 1, end);
      currentScore = 0;
      totalLoaded = selected.length;
      updateScore();

      quizContainer.innerHTML = selected.map((item, idx) => {
        const qName = `q_${idx}`;
        const optionsHtml = item.options.map((opt, optIdx) => `
          <label class="option-label" data-opt="${optIdx}">
            <input type="radio" name="${qName}" value="${optIdx}" />
            <span>(${letters[optIdx]}) ${escapeHtml(opt)}</span>
          </label>
        `).join("");

        return `
          <div class="q-card" data-ans="${item.ans}" data-answered="false">
            <div class="q-title">Q${item.id}. ${escapeHtml(item.q)}</div>
            <div class="options-list">${optionsHtml}</div>
            <div class="feedback"></div>
          </div>
        `;
      }).join("");

      document.querySelectorAll(".q-card").forEach((card) => {
        const correctAns = parseInt(card.dataset.ans, 10);
        const labels = card.querySelectorAll(".option-label");
        const radios = card.querySelectorAll('input[type="radio"]');
        const feedback = card.querySelector(".feedback");

        radios.forEach((radio) => {
          radio.addEventListener("change", () => {
            if (card.dataset.answered === "true") return;
            card.dataset.answered = "true";

            const chosen = parseInt(radio.value, 10);

            radios.forEach((r) => (r.disabled = true));
            labels.forEach((l) => l.classList.add("locked"));

            if (chosen === correctAns) {
              labels[chosen].classList.add("correct");
              feedback.textContent = "✅ Correct! (+1 Mark)";
              feedback.classList.add("show", "correct-msg");
              currentScore++;
              updateScore();
            } else {
              labels[chosen].classList.add("incorrect");
              labels[correctAns].classList.add("correct");
              feedback.textContent = "❌ Incorrect. The green option is the correct answer.";
              feedback.classList.add("show", "incorrect-msg");
            }
          });
        });
      });

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    btnLoad.addEventListener("click", loadQuiz);
    loadQuiz();
  </script>
</body>
</html>
