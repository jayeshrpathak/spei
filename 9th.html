
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standard 9 | SPEI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f3f6fc;color:#17243a}
header{background:linear-gradient(135deg,#142d50,#2563a8);color:white;text-align:center;padding:35px 18px}
.back{display:inline-block;color:white;text-decoration:none;background:#ffffff25;padding:10px 16px;border-radius:8px;margin-bottom:20px}
.container{max-width:1000px;margin:35px auto;padding:18px}
h2{margin-bottom:10px}
.subtitle{color:#dceaff}
.search{width:100%;padding:15px;border:1px solid #d5dce8;border-radius:10px;margin:25px 0;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{background:white;border:1px solid #e3e9f2;padding:22px;border-radius:12px}
.card h3{font-size:17px;margin-bottom:18px}
.btn{display:inline-block;background:#2563a8;color:white;padding:11px 18px;text-decoration:none;border-radius:7px;font-weight:bold}
.btn:hover{background:#142d50}
.status{text-align:center;padding:25px;color:#68758a}
footer{text-align:center;padding:25px;color:#778397}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
<a href="index.html" class="back">← Home</a>
<h1>📘 Standard 9</h1>
<p class="subtitle">Chapter-wise Study Notes</p>
</header>

<main class="container">
<h2>Study Materials</h2>
<p>Choose a chapter to view its Google Slides notes.</p>
<input id="search" class="search" placeholder="🔍 Search chapter...">
<div id="chapters" class="grid"></div>
<div id="status" class="status">Loading chapters...</div>
</main>

<footer>© 2026 SPEI | Standard 9</footer>

<script>
const API =
"https://api.github.com/repos/jayeshrpathak/spei/contents/9/pdfs";

const standard = "9";

// Replace these keys with the exact PDF filenames.
// Example: "1.pdf": "Real Chapter Name"
const chapterNames = {
    // "1.pdf": "Chapter 1 - Actual Chapter Name",
    // "2.pdf": "Chapter 2 - Actual Chapter Name"
};

let allChapters = [];

async function loadChapters() {
    const status = document.getElementById("status");

    try {
        const response = await fetch(API);

        if (!response.ok) throw new Error("GitHub directory unavailable");

        const files = await response.json();

        allChapters = files
            .filter(file => file.type === "file" &&
                file.name.toLowerCase().endsWith(".pdf"))
            .sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric:true}))
            .map(file => ({
                file: file.name,
                name: chapterNames[file.name] ||
                    file.name.replace(/\.pdf$/i, "").replace(/[-_]/g, " ")
            }));

        status.textContent = allChapters.length
            ? ""
            : "No PDF files found.";

        render(allChapters);

    } catch(error) {
        status.textContent =
            "Unable to load chapters. Please check the GitHub repository.";
    }
}

function render(list) {
    const container = document.getElementById("chapters");
    container.innerHTML = "";

    list.forEach(chapter => {
        const card = document.createElement("div");
        card.className = "card";

        const heading = document.createElement("h3");
        heading.textContent = "📖 " + chapter.name;

        const link = document.createElement("a");
        link.className = "btn";
        link.textContent = "View Notes →";
        link.href = "slides.html?standard=" +
            standard + "&file=" + encodeURIComponent(chapter.file);

        card.append(heading, link);
        container.appendChild(card);
    });
}

document.getElementById("search").addEventListener("input", function() {
    const term = this.value.toLowerCase();
    render(allChapters.filter(ch => ch.name.toLowerCase().includes(term)));
});

loadChapters();
</script>
</body>
</html>
