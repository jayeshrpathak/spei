<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Standard 9th – Computer Studies</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary: #0f766e;
      --secondary-hover: #115e59;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .header-title h1 {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .header-title p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .back-link {
      text-decoration: none;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.95rem;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      transition: background 0.2s;
    }

    .back-link:hover {
      background: #eff6ff;
    }

    .search-bar {
      margin-bottom: 20px;
    }

    .search-bar input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 1rem;
      background: var(--card);
      outline: none;
    }

    .search-bar input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
    }

    .chapter-badge {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--primary);
      background: #eff6ff;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .card h2 {
      font-size: 1.08rem;
      font-weight: 600;
      color: var(--text);
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      text-align: center;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
      color: #ffffff;
      transition: background 0.2s;
    }

    .btn-pdf {
      background: var(--primary);
    }

    .btn-pdf:hover {
      background: var(--primary-hover);
    }

    .btn-slides {
      background: var(--secondary);
    }

    .btn-slides:hover {
      background: var(--secondary-hover);
    }

    .btn-disabled {
      background: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Modal Viewer */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      z-index: 1000;
      padding: 16px;
      align-items: center;
      justify-content: center;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      background: var(--card);
      width: 100%;
      max-width: 1050px;
      height: 90vh;
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: #f8fafc;
    }

    .modal-title {
      font-weight: 600;
      font-size: 1rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modal-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .open-tab {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #ffffff;
    }

    .close-btn {
      background: #ef4444;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-body {
      flex: 1;
      background: #e2e8f0;
    }

    .modal-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-title">
        <h1>Standard 9th – Computer Studies</h1>
        <p>Chapter-wise Study Material (PDFs &amp; Slides)</p>
      </div>
      <a href="index.html" class="back-link">&larr; Back to Portal</a>
    </header>

    <div class="search-bar">
      <input
        type="text"
        id="searchInput"
        placeholder="Search by chapter number or title..."
        aria-label="Search chapters"
      />
    </div>

    <main id="chapterGrid" class="grid"></main>
  </div>

  <!-- Modal Viewer -->
  <div id="viewerModal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modalTitle" class="modal-title">Viewer</span>
        <div class="modal-controls">
          <a id="openNewTab" href="#" target="_blank" rel="noopener" class="open-tab">Open in New Tab</a>
          <button id="closeModal" class="close-btn" type="button">Close</button>
        </div>
      </div>
      <div class="modal-body">
        <iframe id="viewerFrame" src="" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    // Update this array with your actual filenames and slide links
    const chapters = [
      {
        number: "Chapter 1",
        title: "Introduction to Computers",
        pdf: "9/pdfs/ch1.pdf",
        slides: "9/slides/ch1.pdf" // Or a Google Slides embed URL
      },
      {
        number: "Chapter 2",
        title: "History and Evolution of Computers",
        pdf: "9/pdfs/ch2.pdf",
        slides: "9/slides/ch2.pdf"
      },
      {
        number: "Chapter 3",
        title: "Input and Output Devices",
        pdf: "9/pdfs/ch3.pdf",
        slides: "9/slides/ch3.pdf"
      },
      {
        number: "Chapter 4",
        title: "Memory, Storage Devices and Data Representation",
        pdf: "9/pdfs/ch4.pdf",
        slides: "" // Leave empty to disable the Slides button until ready
      },
      {
        number: "Chapter 5",
        title: "Introduction to Operating System",
        pdf: "9/pdfs/ch5.pdf",
        slides: "9/slides/ch5.pdf"
      }
    ];

    const grid = document.getElementById("chapterGrid");
    const searchInput = document.getElementById("searchInput");
    const modal = document.getElementById("viewerModal");
    const modalTitle = document.getElementById("modalTitle");
    const viewerFrame = document.getElementById("viewerFrame");
    const openNewTab = document.getElementById("openNewTab");
    const closeModalBtn = document.getElementById("closeModal");

    function renderChapters(list) {
      grid.innerHTML = "";

      if (list.length === 0) {
        grid.innerHTML = `<div class="empty-state">No matching chapters found.</div>`;
        return;
      }

      list.forEach((ch) => {
        const card = document.createElement("article");
        card.className = "card";

        const pdfDisabled = !ch.pdf ? "btn-disabled" : "";
        const slidesDisabled = !ch.slides ? "btn-disabled" : "";

        card.innerHTML = `
          <div>
            <span class="chapter-badge">${ch.number}</span>
            <h2>${ch.title}</h2>
          </div>
          <div class="actions">
            <button
              type="button"
              class="btn btn-pdf ${pdfDisabled}"
              onclick="openViewer('${ch.pdf}', '${ch.number}: ${ch.title} (PDF)')"
            >
              View PDF
            </button>
            <button
              type="button"
              class="btn btn-slides ${slidesDisabled}"
              onclick="openViewer('${ch.slides}', '${ch.number}: ${ch.title} (Slides)')"
            >
              View Slides
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openViewer(url, title) {
      if (!url) return;
      modalTitle.textContent = title;
      viewerFrame.src = url;
      openNewTab.href = url;
      modal.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeViewer() {
      modal.classList.remove("open");
      viewerFrame.src = "";
      document.body.style.overflow = "";
    }

    closeModalBtn.addEventListener("click", closeViewer);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeViewer();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modal.classList.contains("open")) closeViewer();
    });

    searchInput.addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      const filtered = chapters.filter(
        (ch) =>
          ch.number.toLowerCase().includes(q) ||
          ch.title.toLowerCase().includes(q)
      );
      renderChapters(filtered);
    });

    renderChapters(chapters);
  </script>
</body>
</html>
