<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Notes | Computer Studies</title>
  <style>
    :root {
      --bar-bg: #0f172a;
      --bar-border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #020617;
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--bar-bg);
      border-bottom: 1px solid var(--bar-border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      min-height: 56px;
    }

    .left-group {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .title-wrap {
      min-width: 0;
    }

    .title-wrap h1 {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title-wrap p {
      font-size: 12px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      text-decoration: none;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn:hover { background: #334155; }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
    }

    .btn-primary:hover { background: var(--accent-hover); }

    #viewer-wrap {
      flex: 1;
      width: 100%;
      background: #000;
      position: relative;
    }

    #slides-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .error-box {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
      color: var(--muted);
    }
  </style>
  <script src="auth.js"></script>
</head>
<body>
  <script>
    if (sessionStorage.getItem("spei_portal_unlocked") !== "true") {
      window.location.href = "index.html";
    }
  </script>

  <header>
    <div class="left-group">
      <a id="back-btn" href="index.html" class="btn">&larr; Back</a>
      <div class="title-wrap">
        <h1 id="page-title">Study Notes</h1>
        <p id="page-sub">Computer Studies &bull; Jayesh Pathak</p>
      </div>
    </div>

    <div class="actions">
      <button id="fullscreen-btn" class="btn btn-primary" type="button">Full Screen</button>
      <a id="present-link" href="#" target="_blank" rel="noopener" class="btn">Open Slides</a>
    </div>
  </header>

  <main id="viewer-wrap">
    <iframe
      id="slides-frame"
      src=""
      allowfullscreen="true"
      mozallowfullscreen="true"
      webkitallowfullscreen="true"
    ></iframe>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const std = params.get("std") || "";
    const title = params.get("title") || "Study Notes";
    const slideUrl = params.get("slide") || "";

    const backBtn = document.getElementById("back-btn");
    const pageTitle = document.getElementById("page-title");
    const pageSub = document.getElementById("page-sub");
    const slidesFrame = document.getElementById("slides-frame");
    const viewerWrap = document.getElementById("viewer-wrap");
    const fullscreenBtn = document.getElementById("fullscreen-btn");
    const presentLink = document.getElementById("present-link");

    document.title = `${title} | Study Notes`;
    pageTitle.textContent = title;
    if (std) {
      pageSub.textContent = `Standard ${std} • Computer Studies • Jayesh Pathak`;
      backBtn.href = `${std}th.html`;
      backBtn.innerHTML = `&larr; Std ${std}`;
    }

    function toEmbedUrl(url) {
      const match = url.match(/\/presentation\/d\/([a-zA-Z0-9_-]+)/);
      if (match) {
        return `https://docs.google.com/presentation/d/${match[1]}/embed?start=false&loop=false&delayms=3000`;
      }
      return url;
    }

    function toPresentUrl(url) {
      const match = url.match(/\/presentation\/d\/([a-zA-Z0-9_-]+)/);
      if (match) {
        return `https://docs.google.com/presentation/d/${match[1]}/present`;
      }
      return url;
    }

    if (slideUrl) {
      slidesFrame.src = toEmbedUrl(slideUrl);
      presentLink.href = toPresentUrl(slideUrl);
    } else {
      viewerWrap.innerHTML = `
        <div class="error-box">
          <p>No slides link found for this chapter.</p>
          <a href="${backBtn.href}" class="btn">Go Back</a>
        </div>
      `;
      fullscreenBtn.style.display = "none";
      presentLink.style.display = "none";
    }

    fullscreenBtn.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        if (viewerWrap.requestFullscreen) {
          viewerWrap.requestFullscreen();
        } else if (viewerWrap.webkitRequestFullscreen) {
          viewerWrap.webkitRequestFullscreen();
        }
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    });
  </script>
</body>
</html>
